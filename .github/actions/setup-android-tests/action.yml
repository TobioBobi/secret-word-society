name: Set up Android emulator tests
description: Prepare Flutter, Java, KVM and guarded disk space for API-35 emulator jobs.
runs:
  using: composite
  steps:
    - name: Free disk space for Android
      shell: bash
      run: |
        echo 'Disk space before preparation'
        df -h / "$GITHUB_WORKSPACE" "$HOME" "$ANDROID_HOME" "$RUNNER_TEMP"
        # Unused toolchains only. Keep Android SDK/NDK, Java, Flutter and caches.
        sudo rm -rf -- /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        echo 'Disk space after preparation'
        df -h / "$GITHUB_WORKSPACE" "$HOME" "$ANDROID_HOME" "$RUNNER_TEMP"

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/**/*.gradle.kts
          android/gradle/wrapper/gradle-wrapper.properties

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: '3.47.7'
        cache: true

    - name: Install locked dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Generate localizations
      shell: bash
      run: flutter gen-l10n

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Check Android disk guard
      shell: bash
      run: bash scripts/test-check-android-disk.sh

    - name: Check space before Android SDK installation
      shell: bash
      run: |
        bash scripts/check-android-disk.sh "$((AVD_DISK_GIB + ANDROID_SDK_RESERVE_GIB + ANDROID_BUILD_RESERVE_GIB))" \
          "$GITHUB_WORKSPACE" "$HOME" "$ANDROID_HOME" "$RUNNER_TEMP"
