name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Check Android aggregate gate
        run: bash scripts/test-require-android-test-groups.sh

      - name: Build Android APK
        # --no-pub skips release plugin regeneration with this Flutter version:
        # https://github.com/flutter/flutter/issues/169336
        run: flutter build apk --release

  android-game-tests:
    name: Android game tests (API 35, group ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      AVD_DISK_GIB: 8
      # SDK download/extraction (8 GiB) + Flutter/Gradle builds and headroom (8 GiB).
      ANDROID_SDK_RESERVE_GIB: 8
      ANDROID_BUILD_RESERVE_GIB: 8

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Free disk space for Android
        run: |
          echo 'Disk space before preparation'
          df -h / "$GITHUB_WORKSPACE" "$HOME" "$ANDROID_HOME" "$RUNNER_TEMP"
          # Unused toolchains only. Keep Android SDK/NDK, Java, Flutter and caches.
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo 'Disk space after preparation'
          df -h / "$GITHUB_WORKSPACE" "$HOME" "$ANDROID_HOME" "$RUNNER_TEMP"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check Android disk guard
        run: bash scripts/test-check-android-disk.sh

      - name: Check space before Android SDK installation
        run: |
          bash scripts/check-android-disk.sh "$((AVD_DISK_GIB + ANDROID_SDK_RESERVE_GIB + ANDROID_BUILD_RESERVE_GIB))" \
            "$GITHUB_WORKSPACE" "$HOME" "$ANDROID_HOME" "$RUNNER_TEMP"

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: ${{ env.AVD_DISK_GIB }}G
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -e
            flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded --dart-define=GAME_TEST_GROUP=${{ matrix.group }}
            if [ '${{ matrix.group }}' = '2' ]; then
              flutter test integration_test/photo_pipeline_test.dart -d emulator-5554 --reporter expanded
              flutter build apk --release --target integration_test/photo_release_probe.dart
              bash scripts/check-photo-release.sh build/app/outputs/flutter-apk/app-release.apk emulator-5554
            fi

  android-integration:
    # Preserve the required check's name and GitHub Actions source. A matrix
    # result is successful only when every group succeeds (fail-fast is off).
    name: Android integration tests (API 35)
    needs: [android-game-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require every Android test group
        env:
          GAME_TEST_RESULT: ${{ needs.android-game-tests.result }}
        run: bash scripts/require-android-test-groups.sh "$GAME_TEST_RESULT"
