name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AVD_DISK_GIB: 8
  # SDK download/extraction (8 GiB) + Flutter/Gradle builds and headroom (8 GiB).
  ANDROID_SDK_RESERVE_GIB: 8
  ANDROID_BUILD_RESERVE_GIB: 8


jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Check Android aggregate gate
        run: bash scripts/test-require-android-test-groups.sh

      - name: Build Android APK
        # --no-pub skips release plugin regeneration with this Flutter version:
        # https://github.com/flutter/flutter/issues/169336
        run: flutter build apk --release

  android-game-tests:
    name: Android game tests (API 35, group ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Android emulator tests
        uses: ./.github/actions/setup-android-tests

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: ${{ env.AVD_DISK_GIB }}G
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # This action executes each script line in a separate shell.
          script: bash scripts/run-android-game-group.sh '${{ matrix.group }}'

  android-photo-release:
    name: Android release photo probe (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Android emulator tests
        uses: ./.github/actions/setup-android-tests

      - name: Build AOT/R8 release photo probe
        run: flutter build apk --release --target integration_test/photo_release_probe.dart

      - name: Run release photo probe offline on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: ${{ env.AVD_DISK_GIB }}G
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/check-photo-release.sh build/app/outputs/flutter-apk/app-release.apk emulator-5554

  android-integration:
    # Preserve the required check's name and GitHub Actions source. A matrix
    # result is successful only when every group succeeds (fail-fast is off).
    # The independent release photo probe must also succeed.
    name: Android integration tests (API 35)
    needs: [android-game-tests, android-photo-release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require every Android test group and release photo probe
        env:
          GAME_TEST_RESULT: ${{ needs.android-game-tests.result }}
          PHOTO_RELEASE_RESULT: ${{ needs.android-photo-release.result }}
        run: bash scripts/require-android-test-groups.sh "$GAME_TEST_RESULT" "$PHOTO_RELEASE_RESULT"
